<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NepPOS</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="NepPOS.Presentation.Register.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Screen fit: scale the whole app to the window, so a 1024 x 768 register and a
        // 1920 x 1080 one show the same layout. Ctrl + / Ctrl - / Ctrl 0 adjust it per register
        // (remembered); F11 switches full screen on and off.
        (function () {
            const designWidth = 1366, designHeight = 768, key = "neppos.screenScale";
            let extra = 1;
            try { extra = parseFloat(localStorage.getItem(key)) || 1; } catch { }

            function fit() {
                const auto = Math.min(innerWidth / designWidth, innerHeight / designHeight);
                const z = Math.min(2.5, Math.max(0.6, auto * extra));
                document.documentElement.style.setProperty("--z", z.toFixed(3));
            }

            function setExtra(value) {
                extra = Math.min(1.6, Math.max(0.7, Math.round(value * 20) / 20));
                try { localStorage.setItem(key, String(extra)); } catch { }
                fit();
            }

            addEventListener("resize", fit);
            addEventListener("keydown", e => {
                if (e.key === "F11") {
                    e.preventDefault();
                    if (window.DotNet) DotNet.invokeMethodAsync("NepPOS.Presentation.Register", "ToggleFullScreen");
                } else if (e.ctrlKey && (e.key === "=" || e.key === "+")) { e.preventDefault(); setExtra(extra + 0.05); }
                else if (e.ctrlKey && e.key === "-") { e.preventDefault(); setExtra(extra - 0.05); }
                else if (e.ctrlKey && e.key === "0") { e.preventDefault(); setExtra(1); }
            });
            fit();
        })();
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
