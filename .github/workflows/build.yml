# Builds the whole solution (including the Windows register) and runs every test
# on each pull request and on pushes to main. A red check means don't merge.
name: Build and test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        with:
          dotnet-version: 9.0.x

      # The runner also has a newer .NET SDK, which dotnet would pick by default. The register is a
      # .NET 9 MAUI app, so pin this run to the .NET 9 SDK just installed (only on the build machine;
      # developer PCs use whatever SDK they have).
      - name: Use the .NET 9 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --roll-forward latestPatch --force

      # The register is a .NET MAUI app, so the build needs the MAUI workload (for that SDK).
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # Build restores too, with the same Release settings, so the register gets its Windows runtime (win-x64).
      - name: Build
        run: dotnet build NepPOS.sln --configuration Release

      - name: Test
        run: dotnet test NepPOS.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
